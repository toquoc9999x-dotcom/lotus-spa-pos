<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Harmony Spa - POS System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>SEN LOTUS HARMONY SPA & RETREAT</h1>
        <div class="header-status">Hệ Thống Quản Lý Bán Hàng</div>
    </header>

    <div class="main-container">
        <!-- CỘT 1: DANH MỤC DỊCH VỤ -->
        <section class="section menu-section">
            <h2>📋 Danh Mục Dịch Vụ</h2>
            <div id="category-list" class="categories"></div>
            <div id="service-list" class="services-grid"></div>
        </section>

        <!-- CỘT 2: ĐƠN HÀNG HIỆN TẠI & HÀNG CHỜ -->
        <section class="section cart-section">
            <h2>🛒 Đơn Hàng Hiện Tại</h2>
            <div class="customer-info">
                <input type="text" id="cust-name" placeholder="Tên khách hàng / Phòng">
                <input type="text" id="cust-guide" placeholder="Tên HDV / Tour (Nếu có)">
            </div>
            
            <div class="cart-items" id="cart-items">
                <!-- Các dịch vụ đã chọn sẽ hiện ở đây -->
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Tổng tiền:</span>
                    <strong id="total-amount">0 VNĐ</strong>
                </div>
                <div class="checkout-actions">
                    <button class="btn btn-warning" onclick="savePendingOrder()">⏳ Lưu Hàng Chờ</button>
                    <button class="btn btn-success" onclick="processPayment()">💳 Thanh Toán</button>
                </div>
            </div>

            <hr>

            <!-- KHU VỰC ĐƠN HÀNG CHỜ -->
            <h2>⏳ Danh Sách Hàng Chờ</h2>
            <div id="pending-list" class="pending-orders-list">
                <!-- Các đơn hàng chờ hiển thị ở đây -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
